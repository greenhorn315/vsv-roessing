vereinsheim:
  order: 5
  name: Vereinsheim VSV Rössing
  street: Zum Klay 6
  postalCode: '31171'
  city: Nordstemmen
  note: am Sportplatz
  facilities: 'Gaststube mit Tresen und Küche. Am Vereinsheim gibt es einen Defibrillator (AED); zugänglich ist er nur bei Sportveranstaltungen, sonst ist das Tor zum Sportplatz verschlossen.'
  photos:
    - src: ../assets/sportstaetten/vereinsheim.jpg
      alt: Vereinsheim des VSV Rössing von der Rasenfläche aus, ein eingeschossiger Klinkerbau mit rotem Ziegeldach, an der Wand das Banner „Herzlich Willkommen auf unserer Sportanlage“, davor eine Hecke
    - src: ../assets/sportstaetten/vereinsheim-terrasse.jpg
      alt: Terrasse vor dem Vereinsheim mit zwei Holzbänken, dazwischen die Eingangstür, darüber das Willkommensbanner mit dem Vereinswappen
      caption: Terrasse
    - src: ../assets/sportstaetten/vereinsheim-gaststaette.jpg
      alt: Gaststube im Vereinsheim mit Tresen, Barhockern, Holztischen und einer Vitrine voller Pokale
      caption: Gaststube
