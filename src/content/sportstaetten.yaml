sportplatz:
  order: 3
  name: VSV-Sportplatz
  alias: Sportplatz Rössing
  street: Zum Klay 6
  postalCode: '31171'
  city: Nordstemmen
  note: Fußball und Leichtathletik im Sommerhalbjahr
  facilities: Rasenplatz mit Laufbahn, dazu eine Weitsprunganlage mit Tartan-Anlaufbahn
  photos:
    - src: ../assets/sportstaetten/sportplatz.jpg
      alt: Rasenplatz des VSV Rössing mit mehreren Toren und Flutlichtmasten unter blauem Himmel, im Vordergrund die rote Laufbahn am Rand des Platzes
    - src: ../assets/sportstaetten/sportplatz-eingang.jpg
      alt: 'Eingang zum Sportplatz: Geländer mit den Buchstaben VSV, links das Kassenhäuschen mit Aushängen, dahinter das Vereinsheim, rechts eine Tafel mit den Eintrittspreisen'
      caption: Eingang
    - src: ../assets/sportstaetten/sportplatz-weitsprunganlage.jpg
      alt: Rote Tartanbahn mit weißer Markierungslinie, die auf eine Sandgrube zuläuft; am Ende harken zwei Personen den Sand
      caption: Weitsprunganlage

feuerplatz:
  order: 4
  name: Feuerplatz am Sportplatz
  street: Zum Klay 6
  postalCode: '31171'
  city: Nordstemmen
  note: 'Treffpunkt der Freitagsradler: Im Sommerhalbjahr wird hier nach der Tour gegrillt'
  photos:
    # ⚠️ Zeigt erkennbare Personen: vor dem Livegang Einwilligung einholen oder Bild ersetzen.
    - src: ../assets/sportstaetten/feuerplatz.jpg
