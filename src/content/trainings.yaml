# Trainingszeiten der Sportarten.
#
# Quellen: Hallenplan Winter 2025/26 für Hallenzeiten und Trainingsorte,
# Übungsleiterliste mit Stand 2022 für alles Übrige.
#
# Im Hallenplan stehen auch Fremdnutzer der Alfred-Stubenrauch-Sporthalle,
# die keine VSV-Angebote sind und hier nicht auftauchen dürfen:
#   Kiga  örtlicher Kindergarten, Mo bis Mi 08:00–12:30
#   DRK   Deutsches Rotes Kreuz, Mo 14:30–15:30
#   FFW   Freiwillige Feuerwehr, Do 18:00–19:00
#
# Die Angaben aus der Übungsleiterliste sind nicht vom Verein bestätigt –
# Gruppen können weggefallen, Zeiten verschoben und Übungsleitungen
# gewechselt sein.
#
# Ein Trainingsort steht dort, wo der Hallenplan die Halle belegt oder die
# Übungsleiterliste ihn nennt. Bei Fußball und Leichtathletik fehlt er
# bewusst: Der Hallenplan gilt fürs Winterhalbjahr, im Sommer wird draußen
# trainiert.
#
# Zum Bearbeiten genügt diese Datei. Das Schema steht in
# src/content.config.ts und wird beim Bauen geprüft.
#
# Der Schlüssel ganz links ist die interne Kennung, frei wählbar, aber in der
# Datei eindeutig; er erscheint nirgends auf der Seite. Darunter:
#
#   title           Name der Gruppe
#   day             Mo, Di, Mi, Do, Fr, Sa oder So
#   time            Anzeigetext: Uhrzeit, Spanne oder „nach Absprache“. In
#                   Anführungszeichen, damit YAML „19:00“ sicher als Text liest
#   place           Trainingsort, darf fehlen
#   sport           Dateiname der Sportart in src/content/sportarten/, ohne .md
#   audience        für wen die Gruppe gedacht ist, in Worten
#   note            kurzer Zusatz, z. B. „14-tägig“
#   trainers        Übungsleitung; eine leere Liste [] heißt: die Gruppe sucht
#                   jemanden
#   ageGroups       kinder, jugend, erwachsene
#   audienceGroups  unter welchem Einstieg „Für wen ist was?“ die Gruppe steht:
#                   kinder, jugend, frauen, maenner, alle – auch mehrere. Eine
#                   Gruppe kann in mehreren stehen, „Jazzdance JAM-Touch“ etwa
#                   bei Jugendlichen und bei allen Altersgruppen
#   season          winter oder sommer; ohne Angabe ganzjährig
#
# Die Reihenfolge in dieser Datei ist egal: Die Seite sortiert nach Wochentag
# und Uhrzeit, bei gleicher Anfangszeit nach dem Namen der Gruppe.

# Fußball
