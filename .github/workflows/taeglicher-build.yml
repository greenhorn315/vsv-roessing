# Braucht das Secret CLOUDFLARE_DEPLOY_HOOK (Deploy Hook aus Cloudflare Pages).
name: Täglicher Build

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Hook auslösen
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::Secret CLOUDFLARE_DEPLOY_HOOK fehlt – kein Neubau ausgelöst."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
